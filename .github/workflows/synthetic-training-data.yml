name: Synthetic Training Data

on:
  workflow_run:
    workflows: ["Code Signals"]
    types: [completed]
  workflow_dispatch:
    inputs:
      code_signals_run_id:
        description: "Code Signals workflow run id to consume"
        required: true
        type: string
      helper_endpoint:
        description: "Local helper endpoint URL"
        required: false
        default: "http://127.0.0.1:11434/api/generate"
        type: string
      helper_model:
        description: "Local helper model name"
        required: false
        default: "synthetic-data-helper"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id || github.event.inputs.code_signals_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  synthetic-training-data:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted]
    timeout-minutes: 60
    env:
      SYNTHETIC_HELPER_ENDPOINT: ${{ github.event.inputs.helper_endpoint || 'http://127.0.0.1:11434/api/generate' }}
      SYNTHETIC_HELPER_MODEL: ${{ github.event.inputs.helper_model || 'synthetic-data-helper' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Resolve code-signals run id
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=${{ github.event.inputs.code_signals_run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download code-signals artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/synthetic-training-data.py download-artifact \
            --repo "${{ github.repository }}" \
            --run-id "${{ steps.resolve.outputs.run_id }}" \
            --out-dir ".artifacts/code-signals-input"

      - name: Generate synthetic training-data artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/synthetic-training-data.py generate \
            --input-dir ".artifacts/code-signals-input" \
            --out-dir ".artifacts/synthetic-training-data/${{ steps.resolve.outputs.run_id }}"

      - name: Upload synthetic training-data artifact
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-training-data-${{ steps.resolve.outputs.run_id }}
          path: .artifacts/synthetic-training-data/${{ steps.resolve.outputs.run_id }}
          if-no-files-found: error
          retention-days: 7
