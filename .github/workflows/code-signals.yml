name: Code Signals

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      helper_endpoint:
        description: "Local helper endpoint URL"
        required: false
        default: "http://localhost:11434/api/chat"
        type: string
      helper_model:
        description: "Local helper model name"
        required: false
        default: "qwen3.5:2b"
        type: string
      synthetic_runner:
        description: "Self-hosted runner for synthetic-training-data (labels must match your agent)"
        required: false
        default: windows
        type: choice
        options:
          - windows
          - macos

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  code-signals:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          use-sticky-disk: "false"

      - name: Install system analyzers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cloc python3-yaml tree universal-ctags

      - name: Generate signal bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/code-signals.py --out-dir ".artifacts/code-signals/${{ github.sha }}"

      - name: Upload signal bundle
        uses: actions/upload-artifact@v7
        with:
          name: code-signals-${{ github.sha }}
          path: .artifacts/code-signals/${{ github.sha }}
          if-no-files-found: error
          retention-days: 7

  synthetic-training-data:
    needs: [code-signals]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # Default: Windows self-hosted first. Manual runs can pick macos. Label sets must match
    # your runner registration (see GitHub: Settings → Actions → Runners → each runner's labels).
    runs-on: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.event.inputs.synthetic_runner == 'macos')
        && fromJSON('["self-hosted", "macOS", "ARM64"]')
        || fromJSON('["self-hosted", "Windows", "X64"]')
      }}
    timeout-minutes: 180
    env:
      SYNTHETIC_HELPER_ENDPOINT: ${{ github.event.inputs.helper_endpoint || 'http://localhost:11434/api/chat' }}
      SYNTHETIC_HELPER_MODEL: ${{ github.event.inputs.helper_model || 'qwen3.5:2b' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Download signal bundle
        uses: actions/download-artifact@v8
        with:
          name: code-signals-${{ github.sha }}
          path: .artifacts/code-signals-input

      # Windows: avoid shell: bash here — Git Bash often breaks on self-hosted runners when the
      # runner passes a Windows temp .sh path (backslashes stripped → "C:Users..." not found).
      - name: Generate synthetic training-data artifact (Windows)
        if: runner.os == 'Windows'
        # Use built-in Windows PowerShell (pwsh/PowerShell 7 is often not installed on self-hosted agents).
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Runner service often inherits a minimal PATH; reload Machine + User PATH from registry
          # so Python matches an interactive session (common self-hosted Windows issue).
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path = (@($machinePath, $userPath, $env:Path) -join ';')
          $args = @(
            'scripts/synthetic-training-data.py', 'generate',
            '--input-dir', '.artifacts/code-signals-input',
            '--out-dir', '.artifacts/synthetic-training-data/${{ github.sha }}'
          )
          # Prefer py -3 and `python` before `python3`: on Windows, python3.exe in WindowsApps is often
          # a Store stub and fails in automation; the real install is usually py.exe / Python3x\python.exe.
          if (Get-Command py -ErrorAction SilentlyContinue) {
            & py -3 @args
          } elseif (Get-Command python -ErrorAction SilentlyContinue) {
            & python @args
          } elseif (Get-Command python3 -ErrorAction SilentlyContinue) {
            & python3 @args
          } else {
            Write-Error 'Neither py -3, python, nor python3 found on PATH (after refreshing Machine/User PATH)'
            exit 1
          }

      - name: Generate synthetic training-data artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then PY=python3
          elif command -v python >/dev/null 2>&1; then PY=python
          else echo "Neither python3 nor python found on PATH"; exit 1; fi
          "$PY" scripts/synthetic-training-data.py generate \
            --input-dir ".artifacts/code-signals-input" \
            --out-dir ".artifacts/synthetic-training-data/${{ github.sha }}"

      - name: Upload synthetic training-data artifact
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-training-data-${{ github.sha }}
          path: .artifacts/synthetic-training-data/${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
