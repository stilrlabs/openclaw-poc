name: Code Signals

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      helper_endpoint:
        description: "Local helper endpoint URL"
        required: false
        default: "http://localhost:11434/api/chat"
        type: string
      helper_model:
        description: "Local helper model name"
        required: false
        default: "qwen3.5:2b"
        type: string
      synthetic_runner:
        description: "Self-hosted runner for synthetic-training-data (labels must match your agent)"
        required: false
        default: windows
        type: choice
        options:
          - windows
          - macos
      train_max_steps:
        description: "LoRA SFT step budget for train-synthetic-lora (smoke default 20)"
        required: false
        default: "20"
        type: string
      train_model_id:
        description: "Hugging Face model id for LoRA training"
        required: false
        default: "Qwen/Qwen3.5-0.8B"
        type: string
      run_lora_training:
        description: "Run LoRA training on the trainer runner (workflow_dispatch only; not run on push/PR)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  code-signals:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          use-sticky-disk: "false"

      - name: Install system analyzers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cloc python3-yaml tree universal-ctags

      - name: Generate signal bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/code-signals.py --out-dir ".artifacts/code-signals/${{ github.sha }}"

      - name: Upload signal bundle
        uses: actions/upload-artifact@v7
        with:
          name: code-signals-${{ github.sha }}
          path: .artifacts/code-signals/${{ github.sha }}
          if-no-files-found: error
          retention-days: 7

  synthetic-training-data:
    needs: [code-signals]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # Default: Windows self-hosted first. Manual runs can pick macos. Label sets must match
    # your runner registration (see GitHub: Settings → Actions → Runners → each runner's labels).
    runs-on: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.event.inputs.synthetic_runner == 'macos')
        && fromJSON('["self-hosted", "macOS", "ARM64"]')
        || fromJSON('["self-hosted", "Windows", "X64"]')
      }}
    timeout-minutes: 180
    env:
      SYNTHETIC_HELPER_ENDPOINT: ${{ github.event.inputs.helper_endpoint || 'http://localhost:11434/api/chat' }}
      SYNTHETIC_HELPER_MODEL: ${{ github.event.inputs.helper_model || 'qwen3.5:2b' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Download signal bundle
        uses: actions/download-artifact@v8
        with:
          name: code-signals-${{ github.sha }}
          path: .artifacts/code-signals-input

      # Windows: avoid shell: bash here — Git Bash often breaks on self-hosted runners when the
      # runner passes a Windows temp .sh path (backslashes stripped → "C:Users..." not found).
      - name: Generate synthetic training-data artifact (Windows)
        if: runner.os == 'Windows'
        # Use built-in Windows PowerShell (pwsh/PowerShell 7 is often not installed on self-hosted agents).
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Runner service often inherits a minimal PATH; reload Machine + User PATH from registry
          # so Python matches an interactive session (common self-hosted Windows issue).
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path = (@($machinePath, $userPath, $env:Path) -join ';')
          $args = @(
            'scripts/synthetic-training-data.py', 'generate',
            '--input-dir', '.artifacts/code-signals-input',
            '--out-dir', '.artifacts/synthetic-training-data/${{ github.sha }}'
          )
          # Prefer py -3 and `python` before `python3`: on Windows, python3.exe in WindowsApps is often
          # a Store stub and fails in automation; the real install is usually py.exe / Python3x\python.exe.
          if (Get-Command py -ErrorAction SilentlyContinue) {
            & py -3 @args
          } elseif (Get-Command python -ErrorAction SilentlyContinue) {
            & python @args
          } elseif (Get-Command python3 -ErrorAction SilentlyContinue) {
            & python3 @args
          } else {
            Write-Error 'Neither py -3, python, nor python3 found on PATH (after refreshing Machine/User PATH)'
            exit 1
          }

      - name: Generate synthetic training-data artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then PY=python3
          elif command -v python >/dev/null 2>&1; then PY=python
          else echo "Neither python3 nor python found on PATH"; exit 1; fi
          "$PY" scripts/synthetic-training-data.py generate \
            --input-dir ".artifacts/code-signals-input" \
            --out-dir ".artifacts/synthetic-training-data/${{ github.sha }}"

      - name: Upload synthetic training-data artifact
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-training-data-${{ github.sha }}
          path: .artifacts/synthetic-training-data/${{ github.sha }}
          if-no-files-found: error
          retention-days: 7

  train-synthetic-lora:
    needs: [synthetic-training-data]
    # Manual only: enable "Run LoRA training" when starting workflow_dispatch in the Actions UI.
    if: github.event_name == 'workflow_dispatch' && inputs.run_lora_training
    # Self-hosted AMD GPU host; runner label must be `trainer` (Settings → Actions → Runners).
    runs-on: trainer
    timeout-minutes: 120
    env:
      TRAIN_MAX_STEPS: ${{ github.event.inputs.train_max_steps || '20' }}
      TRAIN_MODEL_ID: ${{ github.event.inputs.train_model_id || 'Qwen/Qwen3.5-0.8B' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Download synthetic training-data artifact
        uses: actions/download-artifact@v8
        with:
          name: synthetic-training-data-${{ github.sha }}
          path: .artifacts/synthetic-training-input

      - name: ROCm GPU preflight
        shell: bash
        run: |
          set -euo pipefail
          if command -v rocminfo >/dev/null 2>&1; then
            rocminfo | head -n 40
          else
            echo "rocminfo not on PATH; continuing (Docker may still see /dev/kfd and /dev/dri)"
          fi
          docker run --rm \
            --device=/dev/kfd --device=/dev/dri \
            --group-add=video \
            --ipc=host \
            rocm/pytorch:rocm7.2.4_ubuntu24.04_py3.12_pytorch_release_2.8.0 \
            python3 -c "import torch; assert torch.cuda.is_available(), 'ROCm GPU not visible to PyTorch'"

      - name: Build ROCm SFT image
        shell: bash
        run: |
          set -euo pipefail
          docker build -t openclaw-code-signals-sft:local scripts/docker/code-signals-sft

      - name: Train LoRA adapter (ROCm Docker)
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ".artifacts/synthetic-lora/${{ github.sha }}" .cache/huggingface
          DATA_PATH=".artifacts/synthetic-training-input/synthetic-chat-sft.jsonl"
          EVAL_PATH=".artifacts/synthetic-training-input/synthetic-eval-sample.jsonl"
          if [[ ! -f "$DATA_PATH" ]]; then
            echo "::error::Missing $DATA_PATH in synthetic-training-data artifact"
            exit 1
          fi
          EVAL_ARGS=()
          if [[ -f "$EVAL_PATH" ]]; then
            EVAL_ARGS+=(--eval-data "/work/${EVAL_PATH}")
          fi
          docker run --rm \
            --device=/dev/kfd --device=/dev/dri \
            --group-add=video \
            --ipc=host \
            --shm-size=16g \
            -v "$GITHUB_WORKSPACE:/work" \
            -e HF_TOKEN \
            -e HUGGINGFACE_HUB_TOKEN="${HF_TOKEN:-}" \
            -e HUGGINGFACE_HUB_CACHE=/work/.cache/huggingface \
            openclaw-code-signals-sft:local \
            /work/scripts/code-signals-train-lora.py \
              --data "/work/${DATA_PATH}" \
              "${EVAL_ARGS[@]}" \
              --output-dir "/work/.artifacts/synthetic-lora/${{ github.sha }}" \
              --model-id "${TRAIN_MODEL_ID}" \
              --max-steps "${TRAIN_MAX_STEPS}"

      - name: Upload LoRA adapter artifact
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-lora-${{ github.sha }}
          path: .artifacts/synthetic-lora/${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
