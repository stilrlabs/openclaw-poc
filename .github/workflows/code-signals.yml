name: Code Signals

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      helper_endpoint:
        description: "Local helper endpoint URL"
        required: false
        default: "http://localhost:11434/api/chat"
        type: string
      helper_model:
        description: "Local helper model name"
        required: false
        default: "qwen3.5:2b"
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  code-signals:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          use-sticky-disk: "false"

      - name: Install system analyzers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cloc python3-yaml tree universal-ctags

      - name: Generate signal bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/code-signals.py --out-dir ".artifacts/code-signals/${{ github.sha }}"

      - name: Upload signal bundle
        uses: actions/upload-artifact@v7
        with:
          name: code-signals-${{ github.sha }}
          path: .artifacts/code-signals/${{ github.sha }}
          if-no-files-found: error
          retention-days: 7

  synthetic-training-data:
    needs: [code-signals]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 180
    env:
      SYNTHETIC_HELPER_ENDPOINT: ${{ github.event.inputs.helper_endpoint || 'http://localhost:11434/api/chat' }}
      SYNTHETIC_HELPER_MODEL: ${{ github.event.inputs.helper_model || 'qwen3.5:2b' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Download signal bundle
        uses: actions/download-artifact@v8
        with:
          name: code-signals-${{ github.sha }}
          path: .artifacts/code-signals-input

      - name: Generate synthetic training-data artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/synthetic-training-data.py generate \
            --input-dir ".artifacts/code-signals-input" \
            --out-dir ".artifacts/synthetic-training-data/${{ github.sha }}"

      - name: Upload synthetic training-data artifact
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-training-data-${{ github.sha }}
          path: .artifacts/synthetic-training-data/${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
